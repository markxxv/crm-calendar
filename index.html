<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Рабочий календарь агентства недвижимости: месяц, задачи и расписание на сегодня."
    />
    <title>Календарь и задачи · Backoffice</title>

    <!-- Tailwind CSS v4 and Alpine.js v3. No build step required for this prototype. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="./app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style type="text/tailwindcss">
      @theme {
        --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      @source inline("text-gray-400 text-blue-400 text-yellow-400 text-green-400 text-red-400");
    </style>

    <style>
      :root {
        --header-height: 3rem;
        --brand-logo-height: 1.875rem;
        --today-panel-width: 20rem;
        --drawer-width: 21rem;
        --event-detail-width: 27rem;
        --dropdown-min-width: 11.5rem;
        --staff-popover-width: 14rem;
        --staff-picker-width: 15rem;
        --date-popover-width: 16.5rem;

        --day-min-height: 6.75rem;
        --week-column-min-height: 14rem;
        --day-min-height-mobile: 3.5rem;
        --hour-label-width: 3rem;
        --hour-min-height: 2.75rem;
        --event-dot-size: 0.375rem;

        --event-viewing: #60a5fa;
        --event-call: #a78bfa;
        --event-docs: #fbbf24;
        --event-meeting: #4ade80;
        --event-reminder: #fb7185;
      }

      [x-cloak] {
        display: none !important;
      }

      body {
        -webkit-font-smoothing: antialiased;
      }

      .icon {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>

  <body
    x-data="calendarApp"
    @keydown.escape.window="modalOpen = false; selectedDate = null; closeEvent()"
    class="min-h-screen bg-white font-sans text-zinc-900"
  >
    <svg aria-hidden="true" class="absolute size-0 overflow-hidden">
      <defs>
        <symbol id="i-calendar" viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="16" rx="2" />
          <path d="M16 3v4M8 3v4M3 10h18" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14" />
        </symbol>
        <symbol id="i-left" viewBox="0 0 24 24">
          <path d="m15 18-6-6 6-6" />
        </symbol>
        <symbol id="i-right" viewBox="0 0 24 24">
          <path d="m9 18 6-6-6-6" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7" />
          <path d="m16 16 5 5" />
        </symbol>
        <symbol id="i-x" viewBox="0 0 24 24">
          <path d="M18 6 6 18M6 6l12 12" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
          <path d="m5 12 4 4L19 6" />
        </symbol>
        <symbol id="i-down" viewBox="0 0 24 24">
          <path d="m6 9 6 6 6-6" />
        </symbol>
        <symbol id="i-play" viewBox="0 0 24 24">
          <path d="m8 5 11 7-11 7z" />
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </symbol>
        <symbol id="i-flag" viewBox="0 0 24 24">
          <path d="M5 21V4m0 1c4-3 7 3 14 0v11c-7 3-10-3-14 0" />
        </symbol>
        <symbol id="i-minus" viewBox="0 0 24 24">
          <path d="M5 12h14" />
        </symbol>
        <symbol id="i-alert" viewBox="0 0 24 24">
          <path d="M12 3 2 20h20L12 3ZM12 9v5m0 3v.01" />
        </symbol>
        <symbol id="i-home" viewBox="0 0 24 24">
          <path d="m3 10 9-7 9 7v10H3V10Zm6 10v-7h6v7" />
        </symbol>
        <symbol id="i-arrow-up-right" viewBox="0 0 24 24">
          <path d="M7 17 17 7M8 7h9v9" />
        </symbol>
        <symbol id="i-file" viewBox="0 0 24 24">
          <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-7-7Zm0 0v7h7M8 14h8M8 18h6" />
        </symbol>
      </defs>
    </svg>

    <div class="min-h-screen">
      <!-- Global header -->
      <header
        class="flex items-center justify-between gap-3 border-b border-zinc-100 px-3 py-2 sm:px-5"
      >
        <a href="https://spain-costas.com/" aria-label="Spain Costas" class="flex min-w-0 items-center">
          <img
            src="https://spain-costas.com/img/logo.svg"
            alt="Spain Costas"
            class="h-(--brand-logo-height) max-w-40 object-contain object-left sm:max-w-56"
          />
        </a>

        <div class="flex items-center gap-3">
          <button
            type="button"
            @click="openCreate()"
            class="inline-flex items-center justify-center gap-1.5 rounded-lg bg-zinc-900 px-2.5 py-2 text-xs font-semibold text-white transition-colors hover:bg-zinc-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-zinc-500"
          >
            <svg class="icon size-4" aria-hidden="true">
              <use href="#i-plus"></use>
            </svg>
            <span class="hidden sm:inline">Добавить событие</span>
          </button>
          <span
            class="hidden size-8 place-items-center rounded-full bg-zinc-100 text-[0.6875rem] font-semibold text-zinc-500 sm:grid"
            title="Агент"
          >
            АМ
          </span>
        </div>
      </header>

      <main class="grid min-w-0 xl:grid-cols-[minmax(0,1fr)_var(--today-panel-width)]">
        <!-- Monthly calendar -->
        <section class="relative order-2 flex min-w-0 flex-col xl:order-1" aria-label="Календарь задач">
          <div class="px-3 pt-3 pb-2 sm:px-5 sm:pt-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2.5">
                <h1
                  class="text-xl font-semibold tracking-tight sm:text-[1.375rem]"
                  x-text="calendarTitle"
                ></h1>

                <div class="flex items-center gap-1">
                  <button
                    type="button"
                    @click="changePeriod(-1)"
                    :aria-label="view === 'week' ? 'Предыдущая неделя' : 'Предыдущий месяц'"
                    class="grid size-8 place-items-center rounded-lg text-zinc-500 hover:bg-zinc-100"
                  >
                    <svg class="icon size-4" aria-hidden="true">
                      <use href="#i-left"></use>
                    </svg>
                  </button>
                  <button
                    type="button"
                    @click="changePeriod(1)"
                    :aria-label="view === 'week' ? 'Следующая неделя' : 'Следующий месяц'"
                    class="grid size-8 place-items-center rounded-lg text-zinc-500 hover:bg-zinc-100"
                  >
                    <svg class="icon size-4" aria-hidden="true">
                      <use href="#i-right"></use>
                    </svg>
                  </button>
                </div>
              </div>

              <div class="flex items-center gap-2">
                <button
                  type="button"
                  @click="goToday()"
                  class="rounded-lg bg-zinc-100 px-3 py-2 text-xs font-medium hover:bg-zinc-200/70"
                >
                  Сегодня
                </button>
                <div class="inline-flex items-center rounded-lg bg-zinc-100 p-0.5" role="group" aria-label="Режим календаря">
                  <button
                    type="button"
                    @click="setView('week')"
                    :aria-pressed="view === 'week'"
                    :class="view === 'week' ? 'bg-white text-zinc-900 shadow-sm' : 'text-zinc-500 hover:text-zinc-900'"
                    class="rounded-md px-3 py-1.5 text-xs font-medium transition-colors"
                  >
                    Неделя
                  </button>
                  <button
                    type="button"
                    @click="setView('month')"
                    :aria-pressed="view === 'month'"
                    :class="view === 'month' ? 'bg-white text-zinc-900 shadow-sm' : 'text-zinc-500 hover:text-zinc-900'"
                    class="rounded-md px-3 py-1.5 text-xs font-medium transition-colors"
                  >
                    Месяц
                  </button>
                </div>
              </div>
            </div>

            <div class="mt-2 flex flex-wrap items-center justify-between gap-2">
              <div class="flex max-w-full items-center gap-0.5 overflow-x-auto pb-1">
                <template x-for="type in eventTypes" :key="type.id">
                  <button
                    type="button"
                    @click="filter = type.id"
                    :aria-pressed="filter === type.id"
                    :class="filter === type.id ? 'bg-zinc-900 font-semibold text-white' : 'text-zinc-500 hover:bg-zinc-100'"
                    class="inline-flex shrink-0 items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-[0.6875rem] transition-colors"
                  >
                    <span
                      x-show="type.id !== 'all'"
                      class="size-(--event-dot-size) shrink-0 rounded-full"
                      :style="'background-color: var(--event-' + type.id + ')'"
                      aria-hidden="true"
                    ></span>
                    <span x-text="type.label"></span>
                  </button>
                </template>
              </div>

              <label class="relative block min-w-36 flex-1 sm:max-w-56">
                <svg
                  class="icon pointer-events-none absolute top-1/2 left-3 size-4 -translate-y-1/2 text-zinc-400"
                  aria-hidden="true"
                >
                  <use href="#i-search"></use>
                </svg>
                <input
                  type="search"
                  x-model.debounce.150ms="search"
                  placeholder="Найти задачу, объект…"
                  aria-label="Поиск событий"
                  class="h-8 w-full rounded-lg bg-zinc-50 pr-3 pl-9 text-xs outline-none ring-1 ring-transparent placeholder:text-zinc-400 focus:bg-white focus:ring-zinc-200"
                />
              </label>
            </div>
          </div>

          <div x-show="view === 'month'" x-cloak class="min-w-0">
            <div class="w-full min-w-0">
              <div class="grid grid-cols-7 border-b border-zinc-100 bg-zinc-50/60">
                <template
                  x-for="(weekday, index) in ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс']"
                  :key="weekday"
                >
                  <div
                    class="px-1.5 py-1.5 text-center text-[0.5625rem] font-semibold tracking-wide text-zinc-400 uppercase sm:px-3"
                    :class="index >= 5 && 'text-zinc-300'"
                    x-text="weekday"
                  ></div>
                </template>
              </div>

              <div class="grid grid-cols-7 auto-rows-[minmax(var(--day-min-height-mobile),1fr)] sm:auto-rows-[minmax(var(--day-min-height),1fr)]">
                <template x-for="cell in calendarDays" :key="cell.key">
                  <div
                    :class="{
                      'bg-zinc-50/70': cell.outside,
                      'bg-zinc-50/80': cell.weekend && !cell.outside && cell.key !== today,
                      'bg-zinc-50': cell.key === today,
                      'ring-1 ring-inset ring-zinc-700 z-10': selectedDate === cell.key,
                    }"
                    class="group relative flex min-w-0 flex-col border-r border-b border-zinc-100/80 px-1 pt-1.5 pb-2 text-left transition-colors hover:bg-zinc-50 sm:px-2.5 sm:pt-2.5 sm:pb-5"
                  >
                    <button
                      type="button"
                      @click="openDay(cell.key)"
                      :aria-label="
                        cell.outside
                          ? 'Перейти к ' + formatDate(cell.key)
                          : cell.weekend
                            ? formatDate(cell.key) + ', выходной'
                            : formatDate(cell.key) + ', событий: ' + cellEventCount(cell)
                      "
                      class="absolute inset-0 z-0 w-full cursor-pointer focus-visible:outline-2 focus-visible:outline-offset-[-2px] focus-visible:outline-zinc-600"
                    ></button>
                    <div class="pointer-events-none relative mb-1.5 flex w-full items-center justify-between gap-0.5 sm:gap-1">
                      <span
                        :class="{
                          'text-zinc-300': cell.outside,
                          'text-zinc-400': cell.weekend && !cell.outside && cell.key !== today,
                          'text-zinc-600': !cell.outside && !cell.weekend && cell.key !== today,
                          'bg-zinc-900 text-white': cell.key === today,
                        }"
                        class="grid size-5 shrink-0 place-items-center rounded-full text-[0.6875rem] font-semibold sm:size-6"
                        x-text="cell.day"
                      ></span>
                      <span
                        class="text-[0.625rem] font-semibold text-zinc-400"
                        x-show="cellEventCount(cell) > 0"
                        x-text="cellEventCount(cell)"
                      ></span>
                    </div>

                    <div class="relative z-10 hidden min-w-0 w-full flex-col gap-1.5 sm:flex">
                      <template
                        x-for="event in cellEvents(cell).slice(0, 2)"
                        :key="event.id"
                      >
                        <button
                          type="button"
                          @click="openEvent(event.id)"
                          :aria-label="'Открыть событие: ' + event.title"
                          class="flex min-w-0 items-center gap-1.5 rounded-sm text-left hover:bg-zinc-100 focus-visible:outline-2 focus-visible:outline-zinc-400"
                        >
                          <span
                            class="size-(--event-dot-size) shrink-0 rounded-full"
                            :style="'background-color: var(--event-' + event.type + ')'"
                            aria-hidden="true"
                          ></span>
                          <span
                            x-show="event.time"
                            class="shrink-0 text-[0.625rem] tabular-nums text-zinc-400"
                            x-text="event.time"
                          ></span>
                          <span
                            class="min-w-0 truncate text-[0.6875rem] font-medium text-zinc-700"
                            :class="event.done && 'text-zinc-400 line-through'"
                            x-text="event.title"
                            :title="event.title"
                          ></span>
                        </button>
                      </template>
                    </div>

                    <div class="pointer-events-none mt-1 flex items-center gap-1 sm:hidden">
                      <template x-for="event in cellEvents(cell).slice(0, 3)" :key="event.id">
                        <span
                          class="size-(--event-dot-size) rounded-full"
                          :style="'background-color: var(--event-' + event.type + ')'"
                          aria-hidden="true"
                        ></span>
                      </template>
                    </div>

                    <span
                      x-show="cellEventCount(cell) > 2"
                      class="pointer-events-none mt-1 hidden pl-3 text-[0.625rem] font-medium text-zinc-400 sm:block"
                      x-text="'+ ещё ' + (cellEventCount(cell) - 2)"
                    ></span>

                    <div
                      x-show="cellEventCount(cell) > 0"
                      class="pointer-events-none absolute right-2 bottom-2 left-2 hidden h-0.5 overflow-hidden rounded-full bg-zinc-100 sm:block"
                    >
                      <div
                        class="h-full w-(--load) rounded-full bg-zinc-400"
                        :style="'--load: ' + dayLoad(cell.key) + '%'"
                      ></div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>

          <!-- Monday-Friday overview; stacked on phones, two columns on tablets. -->
          <div x-show="view === 'week'" x-cloak class="min-w-0">
            <div class="grid grid-cols-1 gap-px bg-zinc-100 sm:grid-cols-2 xl:grid-cols-5">
              <template x-for="day in weekDays" :key="day.key">
                <section
                  :class="day.weekend ? 'bg-zinc-50/80' : day.key === today ? 'bg-blue-50/40' : 'bg-white'"
                  class="min-w-0 p-1.5 xl:min-h-(--week-column-min-height)"
                >
                  <div class="flex items-center justify-between gap-2">
                    <button
                      type="button"
                      @click="openDay(day.key)"
                      class="flex min-w-0 items-center gap-2 rounded-md text-left focus-visible:outline-2 focus-visible:outline-zinc-600"
                      :aria-label="'Открыть ' + formatDate(day.key)"
                    >
                      <span
                        :class="day.weekend ? 'text-zinc-400' : 'text-zinc-500'"
                        class="text-[0.625rem] font-medium uppercase"
                        x-text="day.weekday"
                      ></span>
                      <span
                        :class="day.key === today ? 'bg-zinc-900 text-white' : day.weekend ? 'text-zinc-400' : 'text-zinc-900'"
                        class="grid size-7 shrink-0 place-items-center rounded-full text-sm font-semibold"
                        x-text="day.day"
                      ></span>
                    </button>
                    <span
                      x-show="weekDayEvents(day).length"
                      class="text-[0.6875rem] font-medium tabular-nums text-zinc-400"
                      x-text="weekDayEvents(day).length"
                    ></span>
                  </div>

                  <div class="mt-2 flex flex-col gap-1.5">
                    <template x-for="event in weekDayEvents(day).slice(0, 6)" :key="event.id">
                      <button
                        type="button"
                        @click="openEvent(event.id)"
                        :aria-label="'Открыть событие: ' + event.title"
                        class="min-w-0 rounded-lg bg-zinc-50 px-2.5 py-2 text-left transition-colors hover:bg-zinc-100 focus-visible:outline-2 focus-visible:outline-zinc-500"
                      >
                        <span class="flex items-center gap-1.5">
                          <span
                            class="size-(--event-dot-size) shrink-0 rounded-full"
                            :style="'background-color: var(--event-' + event.type + ')'"
                            aria-hidden="true"
                          ></span>
                          <span
                            class="text-[0.625rem] font-medium tabular-nums text-zinc-400"
                            x-text="event.time || 'Задача'"
                          ></span>
                        </span>
                        <span
                          class="mt-0.5 block line-clamp-2 text-xs font-medium leading-snug text-zinc-800"
                          :class="event.done && 'text-zinc-400 line-through'"
                          x-text="event.title"
                        ></span>
                      </button>
                    </template>
                    <button
                      type="button"
                      x-show="weekDayEvents(day).length > 6"
                      @click="openDay(day.key)"
                      class="rounded-md px-2 py-1.5 text-left text-[0.6875rem] font-medium text-zinc-500 hover:bg-zinc-100"
                      x-text="'+ ещё ' + (weekDayEvents(day).length - 6)"
                    ></button>
                  </div>
                </section>
              </template>
            </div>
          </div>

          <!-- Selected date: overlay does not replace the Today panel -->
          <div
            x-show="selectedDate"
            x-cloak
            x-transition.opacity.duration.150ms
            class="fixed inset-y-0 right-0 z-40 flex w-full flex-col bg-white shadow-2xl sm:w-(--drawer-width) xl:absolute xl:z-30 xl:h-full xl:border-l xl:border-zinc-100 xl:shadow-[-1rem_0_2.5rem_rgb(0_0_0_/_0.04)]"
            aria-label="События выбранного дня"
          >
            <div class="shrink-0 border-b border-zinc-100 px-4 py-3 sm:px-5">
              <div class="flex min-w-0 items-center justify-between gap-2">
                <h2
                  class="min-w-0 text-[0.9375rem] font-semibold tracking-tight"
                  x-text="selectedDate && formatDate(selectedDate)"
                ></h2>
                <div class="flex shrink-0 items-center gap-1">
                  <button
                    type="button"
                    @click="openCreate(selectedDate)"
                    aria-label="Добавить событие на выбранный день"
                    class="grid size-8 place-items-center rounded-lg bg-zinc-100 text-zinc-700 hover:bg-zinc-200"
                  >
                    <svg class="icon size-4" aria-hidden="true">
                      <use href="#i-plus"></use>
                    </svg>
                  </button>
                  <button
                    type="button"
                    @click="selectedDate = null"
                    aria-label="Закрыть"
                    class="grid size-8 place-items-center rounded-lg text-zinc-500 hover:bg-zinc-100"
                  >
                    <svg class="icon size-4" aria-hidden="true">
                      <use href="#i-x"></use>
                    </svg>
                  </button>
                </div>
              </div>
              <p class="mt-0.5 text-[0.6875rem] text-zinc-400">
                <span x-text="selectedEvents.length"></span> событий
                <span aria-hidden="true">·</span>
                <span x-text="selectedUntimed.length"></span> без времени
              </p>
            </div>

            <div class="min-h-0 flex-1 overflow-y-auto px-4 pb-4 sm:px-5">
              <template
                x-for="section in [
                  { label: 'По времени', items: selectedTimed },
                  { label: 'Без времени', items: selectedUntimed },
                ]"
                :key="section.label"
              >
                <section x-show="section.items.length" class="mt-3">
                  <h3
                    class="mb-1 text-[0.625rem] font-semibold tracking-wide text-zinc-400 uppercase"
                  >
                    <span x-text="section.label"></span> ·
                    <span x-text="section.items.length"></span>
                  </h3>
                  <template x-for="event in section.items" :key="event.id">
                    <button
                      type="button"
                      @click="openEvent(event.id)"
                      class="flex w-full items-start gap-2.5 rounded-lg px-1 py-2.5 text-left hover:bg-zinc-50 focus-visible:outline-2 focus-visible:outline-zinc-400"
                    >
                      <span
                        class="mt-1.5 size-(--event-dot-size) shrink-0 rounded-full"
                        :style="'background-color: var(--event-' + event.type + ')'"
                        aria-hidden="true"
                      ></span>
                      <div class="min-w-0">
                        <p
                          class="text-xs font-semibold text-zinc-800"
                          :class="event.done && 'text-zinc-400 line-through'"
                          x-text="event.title"
                        ></p>
                        <p class="mt-0.5 text-[0.6875rem] leading-relaxed text-zinc-400">
                          <span x-show="event.time" x-text="event.time + ' · '"></span>
                          <span x-text="labelFor(event)"></span>
                          <span
                            x-show="event.attention && !event.done"
                            class="text-zinc-600"
                          >
                            · Требует внимания
                          </span>
                        </p>
                      </div>
                      <span x-show="event.staffIds.length > 1" class="ml-auto flex shrink-0 -space-x-1.5">
                        <template x-for="person in staff.filter((item) => event.staffIds.includes(item.id))" :key="person.id">
                          <img
                            :src="person.photo"
                            :alt="person.name"
                            :title="person.name"
                            class="size-5 rounded-full border-2 border-white object-cover"
                            loading="lazy"
                          />
                        </template>
                      </span>
                    </button>
                  </template>
                </section>
              </template>
            </div>

          </div>
        </section>

        <!-- Hourly agenda: always Today, independent of selected day -->
        <aside
          class="order-1 flex min-w-0 flex-col border-b border-zinc-100 bg-zinc-50/50 xl:order-2 xl:sticky xl:top-0 xl:h-[calc(100dvh-var(--header-height))] xl:border-b-0 xl:border-l xl:border-zinc-100"
          aria-label="Сегодня по часам"
        >
          <div class="shrink-0 px-4 pt-3 pb-2 sm:px-5 xl:px-4">
            <h2 class="text-lg font-semibold tracking-tight">

                        <img
                          :src="person.photo"
                          :alt="person.name"
                          class="size-8 shrink-0 rounded-full bg-zinc-100 object-cover"
                          loading="lazy"
                        />
                        <span class="min-w-0">
                          <span class="block truncate text-xs font-medium text-zinc-800" x-text="person.name"></span>
                          <span class="block truncate text-[0.6875rem] text-zinc-400" x-text="person.role"></span>
                        </span>
                      </button>
                    </template>
                  </div>
                </div>
              </div>
            </div>
            <!-- Compact meeting/task brief -->
            <section x-show="detailEvent.description" class="mt-5">
              <h3 class="text-xs font-semibold text-zinc-900">Задача</h3>
              <p
                class="mt-1.5 text-[0.8125rem] leading-5 text-zinc-600"
                x-text="detailEvent.description"
              ></p>
              <p x-show="detailEvent.goal" class="mt-2 text-xs leading-5 text-zinc-500">
                <span class="font-semibold text-zinc-700">Результат:</span>
                <span x-text="detailEvent.goal"></span>
              </p>
            </section>

            <!-- Linked real estate: shown only for records that reference a property. -->
            <section x-show="detailProperty" class="mt-5">
              <div class="flex items-center justify-between gap-2">
                <h3 class="text-xs font-semibold text-zinc-900">Объект</h3>
                <span
                  class="text-[0.6875rem] text-zinc-400"
                  x-text="detailProperty?.reference"
                ></span>
              </div>
              <a
                :href="detailProperty?.url"
                :aria-label="'Открыть объект ' + (detailProperty?.title || '')"
                target="_blank"
                rel="noopener noreferrer"
                class="mt-2 flex min-w-0 overflow-hidden rounded-xl bg-zinc-50 transition-colors hover:bg-zinc-100 focus-visible:outline-2 focus-visible:outline-zinc-500"
              >
                <div class="relative flex h-28 w-28 shrink-0 items-center justify-center bg-zinc-200 sm:w-30">
                  <svg class="icon size-7 text-zinc-400" aria-hidden="true">
                    <use href="#i-home"></use>
                  </svg>
                  <img
                    :src="detailProperty?.image"
                    :alt="detailProperty?.title"
                    @error="$el.remove()"
                    class="absolute inset-0 size-full object-cover"
                    loading="lazy"
                  />
                </div>
                <div class="flex min-w-0 flex-1 flex-col justify-center gap-1 px-3 py-2.5">
                  <div class="flex min-w-0 items-center justify-between gap-1">
                    <strong class="truncate text-xs font-semibold text-zinc-900" x-text="detailProperty?.title"></strong>
                    <svg class="icon size-3.5 shrink-0 text-zinc-400" aria-hidden="true">
                      <use href="#i-arrow-up-right"></use>
                    </svg>
                  </div>
                  <span
                    class="truncate text-[0.6875rem] text-zinc-500"
                    x-text="detailProperty?.location"
                  ></span>
                  <div class="flex flex-wrap gap-x-2 text-[0.6875rem] text-zinc-500">
                    <span x-text="detailProperty?.area"></span>
                    <span x-text="detailProperty?.beds"></span>
                    <span x-text="detailProperty?.baths"></span>
                  </div>
                  <strong
                    class="text-xs font-semibold text-zinc-900"
                    x-text="detailProperty?.price"
                  ></strong>
                </div>
              </a>
            </section>

            <!-- Visual mock attachments; no fake download links. -->
            <section x-show="detailEvent.attachments.length" class="mt-5">
              <div class="flex items-center justify-between gap-2">
                <h3 class="text-xs font-semibold text-zinc-900">Файлы</h3>
                <span
                  class="text-[0.6875rem] tabular-nums text-zinc-400"
                  x-text="detailEvent.attachments.length"
                ></span>
              </div>
              <div class="mt-2 flex flex-col gap-1.5">
                <template x-for="file in detailEvent.attachments" :key="file.id">
                  <div class="flex min-w-0 items-center gap-2.5 rounded-lg bg-zinc-50 px-2.5 py-2">
                    <span class="grid size-7 shrink-0 place-items-center rounded-md bg-white text-zinc-500">
                      <svg class="icon size-4" aria-hidden="true">
                        <use href="#i-file"></use>
                      </svg>
                    </span>
                    <span
                      class="min-w-0 flex-1 truncate text-xs font-medium text-zinc-700"
                      :title="file.name"
                      x-text="file.name"
                    ></span>
                    <span
                      class="shrink-0 text-[0.625rem] text-zinc-400"
                      x-text="file.type + ' · ' + file.size"
                    ></span>
                  </div>
                </template>
              </div>
            </section>

          </div>
        </aside>
      </template>
    </div>

    <!-- Quick-create dialog -->
    <div
      x-show="modalOpen"
      x-cloak
      x-transition.opacity.duration.150ms
      @click.self="modalOpen = false"
      class="fixed inset-0 z-50 grid place-items-center bg-zinc-950/45 p-4"
    >
      <div
        class="w-full max-w-md rounded-xl bg-white p-6 shadow-2xl"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <div class="flex items-center justify-between gap-3">
          <h2 id="modalTitle" class="text-lg font-semibold tracking-tight">
            Новое событие
          </h2>
          <button
            type="button"
            @click="modalOpen = false"
            aria-label="Закрыть"
            class="grid size-8 place-items-center rounded-md hover:bg-zinc-100"
          >
            <svg class="icon size-4" aria-hidden="true">
              <use href="#i-x"></use>
            </svg>
          </button>
        </div>
        <form @submit.prevent="createEvent()" class="mt-4 space-y-3">
          <label class="block">
            <span class="mb-2 block text-xs font-semibold text-zinc-600">Название *</span>
            <input
              x-ref="eventTitle"
              x-model="form.title"
              required
              maxlength="120"
              placeholder="Например, показ квартиры в центре"
              class="w-full rounded-md border border-zinc-200 px-3 py-2.5 text-sm outline-none focus:border-zinc-500"
            />
          </label>

          <label class="block">
            <span class="mb-2 block text-xs font-semibold text-zinc-600">Тип</span>
            <select
              x-model="form.type"
              class="w-full rounded-md border border-zinc-200 bg-white px-3 py-2.5 text-sm outline-none focus:border-zinc-500"
            >
              <template x-for="type in eventTypes.filter((item) => item.id !== 'all')" :key="type.id">
                <option :value="type.id" x-text="typeNames[type.id]"></option>
              </template>
            </select>
          </label>

          <div class="grid grid-cols-2 gap-3">
            <label class="block">
              <span class="mb-2 block text-xs font-semibold text-zinc-600">Дата</span>
              <input
                x-model="form.date"
                type="date"
                required
                class="w-full min-w-0 rounded-md border border-zinc-200 px-3 py-2.5 text-sm outline-none focus:border-zinc-500"
              />
            </label>
            <label class="block">
              <span class="mb-2 block text-xs font-semibold text-zinc-600">
                Время (не обязательно)
              </span>
              <input
                x-model="form.time"
                type="time"
                class="w-full min-w-0 rounded-md border border-zinc-200 px-3 py-2.5 text-sm outline-none focus:border-zinc-500"
              />
            </label>
          </div>

          <label class="block">
            <span class="mb-2 block text-xs font-semibold text-zinc-600">
              Клиент или объект
            </span>
            <input
              x-model="form.related"
              maxlength="120"
              placeholder="Например, Villa Marina · Анна"
              class="w-full rounded-md border border-zinc-200 px-3 py-2.5 text-sm outline-none focus:border-zinc-500"
            />
          </label>

          <div class="flex justify-end gap-2 pt-2">
            <button
              type="button"
              @click="modalOpen = false"
              class="rounded-md border border-zinc-200 px-4 py-2.5 text-xs font-semibold hover:bg-zinc-50"
            >
              Отмена
            </button>
            <button
              type="submit"
              class="inline-flex items-center gap-2 rounded-md bg-zinc-900 px-4 py-2.5 text-xs font-semibold text-white hover:bg-zinc-700"
            >
              <svg class="icon size-4" aria-hidden="true">
                <use href="#i-plus"></use>
              </svg>
              Создать
            </button>
          </div>
        </form>
      </div>
    </div>

    <div
      x-show="toastMessage"
      x-cloak
      x-transition.opacity.duration.150ms
      role="status"
      class="fixed bottom-6 left-1/2 z-50 -translate-x-1/2 rounded-lg bg-zinc-900 px-4 py-3 text-xs text-white shadow-xl"
      x-text="toastMessage"
    ></div>
  </body>
</html>
