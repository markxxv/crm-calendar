<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Рабочий календарь агентства недвижимости: месяц, задачи и расписание на сегодня."
    />
    <title>Календарь и задачи · Backoffice</title>

    <!-- Tailwind CSS v4 and Alpine.js v3. No build step required for this prototype. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="./app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style type="text/tailwindcss">
      @theme {
        --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>

    <style>
      :root {
        --header-height: 3.5rem;
        --today-panel-width: 20rem;
        --drawer-width: 21rem;
        --day-min-height: 6.75rem;
        --day-min-height-mobile: 3.5rem;
        --hour-label-width: 3rem;
        --hour-min-height: 2.75rem;
        --event-dot-size: 0.375rem;

        --event-viewing: #60a5fa;
        --event-call: #a78bfa;
        --event-docs: #fbbf24;
        --event-meeting: #4ade80;
        --event-reminder: #fb7185;
      }

      [x-cloak] {
        display: none !important;
      }

      body {
        -webkit-font-smoothing: antialiased;
      }

      .icon {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>

  <body
    x-data="calendarApp"
    @keydown.escape.window="modalOpen = false; selectedDate = null"
    class="min-h-screen bg-white font-sans text-zinc-900"
  >
    <svg aria-hidden="true" class="absolute size-0 overflow-hidden">
      <defs>
        <symbol id="i-calendar" viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="16" rx="2" />
          <path d="M16 3v4M8 3v4M3 10h18" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14" />
        </symbol>
        <symbol id="i-left" viewBox="0 0 24 24">
          <path d="m15 18-6-6 6-6" />
        </symbol>
        <symbol id="i-right" viewBox="0 0 24 24">
          <path d="m9 18 6-6-6-6" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7" />
          <path d="m16 16 5 5" />
        </symbol>
        <symbol id="i-x" viewBox="0 0 24 24">
          <path d="M18 6 6 18M6 6l12 12" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
          <path d="m5 12 4 4L19 6" />
        </symbol>
      </defs>
    </svg>

    <div class="min-h-screen">
      <!-- Global header -->
      <header
        class="flex items-center justify-between gap-3 border-b border-zinc-100 px-3 py-2 sm:px-5"
      >
        <div class="flex min-w-0 items-center gap-2.5">
          <div class="grid size-8 shrink-0 place-items-center rounded-lg bg-zinc-900 text-white">
            <svg class="icon size-4" aria-hidden="true">
              <use href="#i-calendar"></use>
            </svg>
          </div>
          <span class="truncate text-sm font-semibold tracking-tight">Календарь и задачи</span>
        </div>

        <div class="flex items-center gap-3">
          <button
            type="button"
            @click="openCreate()"
            class="inline-flex items-center justify-center gap-1.5 rounded-lg bg-zinc-900 px-2.5 py-2 text-xs font-semibold text-white transition-colors hover:bg-zinc-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-zinc-500"
          >
            <svg class="icon size-4" aria-hidden="true">
              <use href="#i-plus"></use>
            </svg>
            <span class="hidden sm:inline">Добавить событие</span>
          </button>
          <span
            class="hidden size-8 place-items-center rounded-full bg-zinc-100 text-[0.6875rem] font-semibold text-zinc-500 sm:grid"
            title="Агент"
          >
            АМ
          </span>
        </div>
      </header>

      <main class="grid min-w-0 xl:grid-cols-[minmax(0,1fr)_var(--today-panel-width)]">
        <!-- Monthly calendar -->
        <section class="relative order-2 flex min-w-0 flex-col xl:order-1" aria-label="Календарь месяца">
          <div class="px-3 pt-3 pb-2 sm:px-5 sm:pt-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2.5">
                <h1
                  class="text-xl font-semibold tracking-tight sm:text-[1.375rem]"
                  x-text="monthTitle"
                ></h1>

                <div class="flex items-center gap-1">
                  <button
                    type="button"
                    @click="changeMonth(-1)"
                    aria-label="Предыдущий месяц"
                    class="grid size-8 place-items-center rounded-lg text-zinc-500 hover:bg-zinc-100"
                  >
                    <svg class="icon size-4" aria-hidden="true">
                      <use href="#i-left"></use>
                    </svg>
                  </button>
                  <button
                    type="button"
                    @click="changeMonth(1)"
                    aria-label="Следующий месяц"
                    class="grid size-8 place-items-center rounded-lg text-zinc-500 hover:bg-zinc-100"
                  >
                    <svg class="icon size-4" aria-hidden="true">
                      <use href="#i-right"></use>
                    </svg>
                  </button>
                </div>
              </div>

              <button
                type="button"
                @click="goToday()"
                class="rounded-lg bg-zinc-100 px-3 py-2 text-xs font-medium hover:bg-zinc-200/70"
              >
                Сегодня
              </button>
            </div>

            <div class="mt-2 flex flex-wrap items-center justify-between gap-2">
              <div class="flex max-w-full items-center gap-0.5 overflow-x-auto pb-1">
                <template x-for="type in eventTypes" :key="type.id">
                  <button
                    type="button"
                    @click="filter = type.id"
                    :aria-pressed="filter === type.id"
                    :class="filter === type.id ? 'bg-zinc-900 font-semibold text-white' : 'text-zinc-500 hover:bg-zinc-100'"
                    class="inline-flex shrink-0 items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-[0.6875rem] transition-colors"
                  >
                    <span
                      x-show="type.id !== 'all'"
                      class="size-(--event-dot-size) shrink-0 rounded-full"
                      :style="'background-color: var(--event-' + type.id + ')'"
                      aria-hidden="true"
                    ></span>
                    <span x-text="type.label"></span>
                  </button>
                </template>
              </div>

              <label class="relative block min-w-36 flex-1 sm:max-w-56">
                <svg
                  class="icon pointer-events-none absolute top-1/2 left-3 size-4 -translate-y-1/2 text-zinc-400"
                  aria-hidden="true"
                >
                  <use href="#i-search"></use>
                </svg>
                <input
                  type="search"
                  x-model.debounce.150ms="search"
                  placeholder="Найти задачу, объект…"
                  aria-label="Поиск событий"
                  class="h-8 w-full rounded-lg bg-zinc-50 pr-3 pl-9 text-xs outline-none ring-1 ring-transparent placeholder:text-zinc-400 focus:bg-white focus:ring-zinc-200"
                />
              </label>
            </div>
          </div>

          <div class="min-w-0">
            <div class="w-full min-w-0">
              <div class="grid grid-cols-7 border-b border-zinc-100 bg-zinc-50/60">
                <template
                  x-for="(weekday, index) in ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс']"
                  :key="weekday"
                >
                  <div
                    class="px-1.5 py-1.5 text-center text-[0.5625rem] font-semibold tracking-wide text-zinc-400 uppercase sm:px-3"
                    :class="index >= 5 && 'text-zinc-300'"
                    x-text="weekday"
                  ></div>
                </template>
              </div>

              <div class="grid grid-cols-7 auto-rows-[minmax(var(--day-min-height-mobile),1fr)] sm:auto-rows-[minmax(var(--day-min-height),1fr)]">
                <template x-for="cell in calendarDays" :key="cell.key">
                  <button
                    type="button"
                    @click="openDay(cell.key)"
                    :aria-label="
                      cell.outside
                        ? 'Перейти к ' + formatDate(cell.key)
                        : cell.weekend
                          ? formatDate(cell.key) + ', выходной'
                          : formatDate(cell.key) + ', событий: ' + cellEventCount(cell)
                    "
                    :class="{
                      'bg-zinc-50/70': cell.outside,
                      'bg-zinc-50/80': cell.weekend && !cell.outside && cell.key !== today,
                      'bg-zinc-50': cell.key === today,
                      'ring-1 ring-inset ring-zinc-700 z-10': selectedDate === cell.key,
                    }"
                    class="group relative flex min-w-0 flex-col border-r border-b border-zinc-100/80 px-1.5 pt-1.5 pb-2 text-left transition-colors hover:bg-zinc-50 focus-visible:z-20 focus-visible:outline-2 focus-visible:outline-zinc-600 sm:px-2.5 sm:pt-2.5 sm:pb-5"
                  >
                    <div class="mb-1.5 flex w-full items-center justify-between gap-1">
                      <span
                        :class="{
                          'text-zinc-300': cell.outside,
                          'text-zinc-400': cell.weekend && !cell.outside && cell.key !== today,
                          'text-zinc-600': !cell.outside && !cell.weekend && cell.key !== today,
                          'bg-zinc-900 text-white': cell.key === today,
                        }"
                        class="grid size-6 shrink-0 place-items-center rounded-full text-[0.6875rem] font-semibold"
                        x-text="cell.day"
                      ></span>
                      <span
                        class="text-[0.625rem] font-semibold text-zinc-400"
                        x-show="cellEventCount(cell) > 0"
                        x-text="cellEventCount(cell)"
                      ></span>
                    </div>

                    <div class="hidden min-w-0 w-full flex-col gap-1.5 sm:flex">
                      <template
                        x-for="event in cellEvents(cell).slice(0, 2)"
                        :key="event.id"
                      >
                        <div class="flex min-w-0 items-center gap-1.5">
                          <span
                            class="size-(--event-dot-size) shrink-0 rounded-full"
                            :style="'background-color: var(--event-' + event.type + ')'"
                            aria-hidden="true"
                          ></span>
                          <span
                            x-show="event.time"
                            class="shrink-0 text-[0.625rem] tabular-nums text-zinc-400"
                            x-text="event.time"
                          ></span>
                          <span
                            class="min-w-0 truncate text-[0.6875rem] font-medium text-zinc-700"
                            :class="event.done && 'text-zinc-400 line-through'"
                            x-text="event.title"
                            :title="event.title"
                          ></span>
                        </div>
                      </template>
                    </div>

                    <div class="mt-1 flex items-center gap-1 sm:hidden">
                      <template x-for="event in cellEvents(cell).slice(0, 3)" :key="event.id">
                        <span
                          class="size-(--event-dot-size) rounded-full"
                          :style="'background-color: var(--event-' + event.type + ')'"
                          aria-hidden="true"
                        ></span>
                      </template>
                    </div>

                    <span
                      x-show="cellEventCount(cell) > 2"
                      class="mt-1 hidden pl-3 text-[0.625rem] font-medium text-zinc-400 sm:block"
                      x-text="'+ ещё ' + (cellEventCount(cell) - 2)"
                    ></span>

                    <div
                      x-show="cellEventCount(cell) > 0"
                      class="absolute right-2 bottom-2 left-2 hidden h-0.5 overflow-hidden rounded-full bg-zinc-100 sm:block"
                    >
                      <div
                        class="h-full w-(--load) rounded-full bg-zinc-400"
                        :style="'--load: ' + dayLoad(cell.key) + '%'"
                      ></div>
                    </div>
                  </button>
                </template>
              </div>
            </div>
          </div>

          <!-- Selected date: overlay does not replace the Today panel -->
          <div
            x-show="selectedDate"
            x-cloak
            x-transition.opacity.duration.150ms
            class="absolute inset-y-0 right-0 z-30 flex w-full flex-col border-l border-zinc-200 bg-white shadow-[-1rem_0_2.5rem_rgb(0_0_0_/_0.06)] sm:w-(--today-panel-width)"
            aria-label="События выбранного дня"
          >
            <div class="border-b border-zinc-200 px-6 pt-7 pb-5">
              <div class="flex items-start justify-between gap-4">
                <div>
                  <p class="text-[0.625rem] font-bold tracking-widest text-zinc-400 uppercase">
                    Детали дня
                  </p>
                  <h2
                    class="mt-2 text-xl font-semibold tracking-tight"
                    x-text="selectedDate && formatDate(selectedDate)"
                  ></h2>
                </div>
                <button
                  type="button"
                  @click="selectedDate = null"
                  aria-label="Закрыть"
                  class="grid size-8 place-items-center rounded-md hover:bg-zinc-100"
                >
                  <svg class="icon size-4" aria-hidden="true">
                    <use href="#i-x"></use>
                  </svg>
                </button>
              </div>
              <p class="mt-2 text-xs text-zinc-400">
                <span x-text="selectedEvents.length"></span> событий ·
                <span x-text="selectedUntimed.length"></span> без времени
              </p>
            </div>

            <div class="min-h-0 flex-1 overflow-y-auto px-6 pb-6">
              <template
                x-for="section in [
                  { label: 'По времени', items: selectedTimed },
                  { label: 'Без времени', items: selectedUntimed },
                ]"
                :key="section.label"
              >
                <section class="mt-6">
                  <h3
                    class="mb-3 text-[0.625rem] font-bold tracking-widest text-zinc-400 uppercase"
                  >
                    <span x-text="section.label"></span> ·
                    <span x-text="section.items.length"></span>
                  </h3>
                  <template x-if="section.items.length === 0">
                    <p class="py-3 text-xs text-zinc-400">Нет событий</p>
                  </template>
                  <template x-for="event in section.items" :key="event.id">
                    <div class="flex gap-3 border-b border-zinc-100 py-3">
                      <span
                        class="mt-1.5 size-(--event-dot-size) shrink-0 rounded-full"
                        :style="'background-color: var(--event-' + event.type + ')'"
                        aria-hidden="true"
                      ></span>
                      <div class="min-w-0">
                        <p
                          class="text-xs font-semibold text-zinc-800"
                          :class="event.done && 'text-zinc-400 line-through'"
                          x-text="event.title"
                        ></p>
                        <p class="mt-1 text-xs leading-relaxed text-zinc-400">
                          <span x-show="event.time" x-text="event.time + ' · '"></span>
                          <span x-text="labelFor(event)"></span>
                          <span
                            x-show="event.attention && !event.done"
                            class="text-zinc-600"
                          >
                            · Требует внимания
                          </span>
                        </p>
                      </div>
                    </div>
                  </template>
                </section>
              </template>
            </div>

            <div class="border-t border-zinc-100 p-6">
              <button
                type="button"
                @click="openCreate(selectedDate)"
                class="inline-flex w-full items-center justify-center gap-2 rounded-lg border border-dashed border-zinc-300 py-3 text-xs font-semibold text-zinc-600 hover:bg-zinc-50"
              >
                <svg class="icon size-4" aria-hidden="true">
                  <use href="#i-plus"></use>
                </svg>
                Добавить событие на этот день
              </button>
            </div>
          </div>
        </section>

        <!-- Hourly agenda: always Today, independent of selected day -->
        <aside
          class="order-1 flex min-w-0 flex-col border-b border-zinc-200 lg:order-2 lg:sticky lg:top-0 lg:h-[calc(100vh-var(--header-height))] lg:min-h-(--panel-min-height) lg:border-b-0 lg:border-l"
          aria-label="Сегодня по часам"
        >
          <div class="shrink-0 border-b border-zinc-200 px-6 pt-7 pb-5">
            <h2 class="text-[1.375rem] font-semibold tracking-tight">
              Сегодня
              <span class="font-normal text-zinc-400">
                · <span x-text="todayLabel"></span>
              </span>
            </h2>
            <div class="mt-4 flex flex-wrap items-center gap-2">
              <span class="rounded-md bg-zinc-100 px-2.5 py-1.5 text-[0.6875rem] text-zinc-600">
                <strong class="text-zinc-900" x-text="timedToday.length"></strong>
                по времени
              </span>
              <span class="rounded-md bg-zinc-100 px-2.5 py-1.5 text-[0.6875rem] text-zinc-600">
                <strong class="text-zinc-900" x-text="untimedToday.length"></strong>
                без времени
              </span>
              <span
                x-show="todayAttention"
                class="rounded-md bg-zinc-100 px-2.5 py-1.5 text-[0.6875rem] text-zinc-600"
              >
                <strong class="text-zinc-900" x-text="todayAttention"></strong>
                в фокусе
              </span>
            </div>
          </div>

          <div class="min-h-0 flex-1 overflow-y-auto overscroll-contain pb-6">
            <section class="pt-5">
              <h3
                class="flex items-center justify-between px-6 pb-3 text-[0.625rem] font-bold tracking-widest text-zinc-400 uppercase"
              >
                <span>Без привязки ко времени</span>
                <span x-text="untimedToday.length"></span>
              </h3>

              <div class="flex flex-col gap-2 px-6 pb-4">
                <template x-if="untimedToday.length === 0">
                  <p class="py-4 text-xs text-zinc-400">Нет задач без времени</p>
                </template>

                <template x-for="event in untimedToday" :key="event.id">
                  <div class="flex min-w-0 items-start gap-2.5 rounded-lg border border-zinc-200 p-3">
                    <button
                      type="button"
                      @click="toggleComplete(event.id)"
                      :aria-label="event.done ? 'Возобновить задачу' : 'Завершить задачу'"
                      :aria-pressed="event.done"
                      :class="event.done && 'border-zinc-900 bg-zinc-900 text-white'"
                      class="grid size-4 shrink-0 place-items-center rounded border border-zinc-300"
                    >
                      <svg x-show="event.done" class="icon size-3" aria-hidden="true">
                        <use href="#i-check"></use>
                      </svg>
                    </button>
                    <div class="min-w-0 flex-1">
                      <p
                        class="text-xs font-semibold"
                        :class="event.done && 'text-zinc-400 line-through'"
                        x-text="event.title"
                      ></p>
                      <p class="mt-1 truncate text-[0.6875rem] text-zinc-400">
                        <span x-text="labelFor(event)"></span>
                        <span
                          x-show="event.attention && !event.done"
                          class="text-zinc-600"
                        >
                          · Требует внимания
                        </span>
                      </p>
                    </div>
                    <span
                      class="mt-1 size-(--event-dot-size) shrink-0 rounded-full"
                      :style="'background-color: var(--event-' + event.type + ')'"
                      aria-hidden="true"
                    ></span>
                  </div>
                </template>
              </div>
            </section>

            <section class="border-t border-zinc-200">
              <h3
                class="flex items-center justify-between px-6 pt-5 pb-3 text-[0.625rem] font-bold tracking-widest text-zinc-400 uppercase"
              >
                <span>Расписание по часам</span>
                <span x-text="timedToday.length"></span>
              </h3>

              <div>
                <template x-for="hour in hours" :key="hour">
                  <div
                    class="grid min-h-(--hour-min-height) grid-cols-[var(--hour-label-width)_minmax(0,1fr)]"
                  >
                    <div
                      class="border-r border-zinc-200 py-3 pl-5 text-[0.6875rem] tabular-nums text-zinc-400"
                      x-text="String(hour).padStart(2, '0') + ':00'"
                    ></div>
                    <div class="flex min-w-0 flex-col gap-1.5 border-b border-zinc-100 px-3 py-1.5">
                      <template x-for="event in eventsAtHour(hour)" :key="event.id">
                        <button
                          type="button"
                          @click="openDay(today)"
                          class="flex min-w-0 items-start gap-2 rounded-md border border-zinc-200 bg-white px-3 py-2.5 text-left transition-colors hover:bg-zinc-50"
                          :class="event.done && 'opacity-60'"
                        >
                          <span
                            class="mt-1 size-(--event-dot-size) shrink-0 rounded-full"
                            :style="'background-color: var(--event-' + event.type + ')'"
                            aria-hidden="true"
                          ></span>
                          <span class="min-w-0 flex-1">
                            <span
                              class="block text-xs font-semibold text-zinc-800"
                              :class="event.done && 'line-through'"
                              x-text="event.title"
                            ></span>
                            <span
                              class="mt-1 block truncate text-[0.6875rem] text-zinc-400"
                              x-text="labelFor(event)"
                            ></span>
                          </span>
                          <span
                            class="shrink-0 text-[0.625rem] tabular-nums text-zinc-400"
                            x-text="event.time"
                          ></span>
                        </button>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </section>
          </div>

        </aside>
      </main>
    </div>

    <!-- Quick-create dialog -->
    <div
      x-show="modalOpen"
      x-cloak
      x-transition.opacity.duration.150ms
      @click.self="modalOpen = false"
      class="fixed inset-0 z-50 grid place-items-center bg-zinc-950/45 p-4"
    >
      <div
        class="w-full max-w-md rounded-xl bg-white p-6 shadow-2xl"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <div class="flex items-center justify-between gap-3">
          <h2 id="modalTitle" class="text-xl font-semibold tracking-tight">
            Новое событие
          </h2>
          <button
            type="button"
            @click="modalOpen = false"
            aria-label="Закрыть"
            class="grid size-8 place-items-center rounded-md hover:bg-zinc-100"
          >
            <svg class="icon size-4" aria-hidden="true">
              <use href="#i-x"></use>
            </svg>
          </button>
        </div>
        <p class="mt-2 mb-6 text-xs text-zinc-400">
          Быстрое создание без перехода на отдельную страницу
        </p>

        <form @submit.prevent="createEvent()" class="space-y-4">
          <label class="block">
            <span class="mb-2 block text-xs font-semibold text-zinc-600">Название *</span>
            <input
              x-ref="eventTitle"
              x-model="form.title"
              required
              maxlength="120"
              placeholder="Например, показ квартиры в центре"
              class="w-full rounded-md border border-zinc-200 px-3 py-2.5 text-sm outline-none focus:border-zinc-500"
            />
          </label>

          <label class="block">
            <span class="mb-2 block text-xs font-semibold text-zinc-600">Тип</span>
            <select
              x-model="form.type"
              class="w-full rounded-md border border-zinc-200 bg-white px-3 py-2.5 text-sm outline-none focus:border-zinc-500"
            >
              <template x-for="type in eventTypes.filter((item) => item.id !== 'all')" :key="type.id">
                <option :value="type.id" x-text="typeNames[type.id]"></option>
              </template>
            </select>
          </label>

          <div class="grid grid-cols-2 gap-3">
            <label class="block">
              <span class="mb-2 block text-xs font-semibold text-zinc-600">Дата</span>
              <input
                x-model="form.date"
                type="date"
                required
                class="w-full min-w-0 rounded-md border border-zinc-200 px-3 py-2.5 text-sm outline-none focus:border-zinc-500"
              />
            </label>
            <label class="block">
              <span class="mb-2 block text-xs font-semibold text-zinc-600">
                Время (не обязательно)
              </span>
              <input
                x-model="form.time"
                type="time"
                class="w-full min-w-0 rounded-md border border-zinc-200 px-3 py-2.5 text-sm outline-none focus:border-zinc-500"
              />
            </label>
          </div>

          <label class="block">
            <span class="mb-2 block text-xs font-semibold text-zinc-600">
              Клиент или объект
            </span>
            <input
              x-model="form.related"
              maxlength="120"
              placeholder="Например, Villa Marina · Анна"
              class="w-full rounded-md border border-zinc-200 px-3 py-2.5 text-sm outline-none focus:border-zinc-500"
            />
          </label>

          <div class="flex justify-end gap-2 pt-2">
            <button
              type="button"
              @click="modalOpen = false"
              class="rounded-md border border-zinc-200 px-4 py-2.5 text-xs font-semibold hover:bg-zinc-50"
            >
              Отмена
            </button>
            <button
              type="submit"
              class="inline-flex items-center gap-2 rounded-md bg-zinc-900 px-4 py-2.5 text-xs font-semibold text-white hover:bg-zinc-700"
            >
              <svg class="icon size-4" aria-hidden="true">
                <use href="#i-plus"></use>
              </svg>
              Создать
            </button>
          </div>
        </form>
      </div>
    </div>

    <div
      x-show="toastMessage"
      x-cloak
      x-transition.opacity.duration.150ms
      role="status"
      class="fixed bottom-6 left-1/2 z-50 -translate-x-1/2 rounded-lg bg-zinc-900 px-4 py-3 text-xs text-white shadow-xl"
      x-text="toastMessage"
    ></div>
  </body>
</html>
